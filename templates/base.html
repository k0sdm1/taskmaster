<!DOCTYPE html>
<html lang="en">
<head>
    {% block head %}
    <link rel="stylesheet" href="style.css" />
    <title>{% block title %}{% endblock %}</title>

    {% endblock %}

<header style="display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; background: var(--bg); border-bottom: 1px solid #eee;">
    <div style="font-weight: bold; font-size: 1.5rem;">
        <a href="/" style="text-decoration: none; color: var(--text);">TaskMaster</a>
    </div>
    <nav style="display: flex; align-items: center; gap: 1rem;">
        {% if not current_user.id %} <a href="{{ url_for('login') }}" style="text-decoration: none; color: var(--text);">Login</a> <a href="{{ url_for('register') }}" style="text-decoration: none; color: var(--text); padding: 5px 15px; border: 1px solid #333; border-radius: 5px;">Register</a> {% else %} <span style="color: #666;">Logged in as: {{ current_user.username }}</span> <a href={{ url_for('logout') }}>logout</a>{% endif %}
    <button id="theme-toggle" title="swith light/dark modes">Toggle theme</button>
    </nav>
</header>
    <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css"
    integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T"
    crossorigin="anonymous"
    />
    <link
    href="{{ url_for('static', filename='vendor/pnotify/PNotify.css') }}"
    rel="stylesheet"
    type="text/css"
    />
    <link
    href="{{ url_for('static', filename='vendor/pnotify/BrightTheme.css') }}"
    />
    <script
    src="{{ url_for('static', filename='vendor/pnotify/PNotify.js') }}"
    ></script>

    <script>
    const btnTheme = document.getElementById("theme-toggle");
    function setThemeButtonText() {
        const theme = document.documentElement.getAttribute("data-theme");
        if (theme === "dark") {
            btnTheme.innerText = "☀️";
        } else {
            btnTheme.innerText = "🌘";
        }
    }
    (function () {
        const saved = localStorage.getItem("theme");

        if (saved) {
            document.documentElement.setAttribute("data-theme", saved);
        } else {
            // use system preference initially
            const prefersDark =
                window.matchMedia("(prefers-color-scheme: dark)").matches;

            document.documentElement.setAttribute(
                "data-theme",
                prefersDark ? "dark" : "light"
            );
        }
        setThemeButtonText()
    })();

    btnTheme.addEventListener("click", () => {
        const current =
            document.documentElement.getAttribute("data-theme");

        const next = current === "dark" ? "light" : "dark";

        document.documentElement.setAttribute("data-theme", next);
        localStorage.setItem("theme", next);
        setThemeButtonText()
    });
    </script>

    <style>
        :root {
            --bg: #ffffff;
            --column-bg: #f1f5f9;
            --text: #222222;
            --card-bg: #ffffff;: #f5f5f5;
            --border: #dddddd;
        }

        /* dark */
        [data-theme="dark"] {
            --bg: #1e1e1e;
            --column-bg: #f1f5f923;
            --text: #f1f1f1;
            --card-bg: #2d2d2d;
            --border: #555555;
        }

        #theme-toggle {
            background: var(--bg);
            border: none;
            outline: none;
            box-shadow: none;
        }

        /* Reset & Base Font */
        body {
            margin: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        /* Header Container */
        .navbar {
            background-color: rgba(255, 255, 255, 0.8); /* Semi-transparent white */
            backdrop-filter: blur(10px); /* Blurs the content behind it */
            border-bottom: 1px solid #e2e8f0;
            padding: 0.75rem 1.5rem;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar .container, .navbar .brand, .navbar .nav-links {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Wrapper to keep things centered */
        .navbar .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Brand / Logo Styling */
        .brand {
            font-size: 1.5rem;
            font-weight: 800;
            color: #1e293b;
            text-decoration: none;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-icon {
            font-size: 1.8rem;
        }

        /* Navigation Links */
        .nav-links {
            gap: 1.5rem;
        }

        .nav-links a {
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        /* User Badge (Logged in state) */
        .user-badge {
            color: #64748b;
            font-size: 0.9rem;
            background: #f1f5f9;
            padding: 6px 12px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Button Styles */
        .btn-primary {
            background-color: #2563eb; /* Nice blue */
            color: white !important;
            padding: 8px 18px;
            border-radius: 8px;
        }

        .btn-primary:hover {
            background-color: #1d4ed8;
        }

        .btn-secondary {
            color: #475569 !important;
        }

        .btn-secondary:hover {
            color: #0f172a !important;
        }

        .btn-outline {
            border: 1px solid #e2e8f0;
            padding: 8px 18px;
            border-radius: 8px;
            color: #ef4444 !important; /* Reddish for logout */
        }

        .btn-outline:hover {
            background-color: #fef2f2;
        }
        /* This makes the body act as a flex container */
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh; /* Full height of viewport */
            margin: 0;
        }

        /* This pushes the footer to the bottom by taking up all available space */
        main, .content-wrapper {
            flex: 1;
        }

        #footer {
            background-color: #f8f9fa;
            padding: 3rem 0 1.5rem 0;
            border-top: 1px solid #e9ecef;
            color: #6c757d;
            font-size: 0.9rem;
        }

        .footer-title {
            color: #212529;
            font-weight: 600;
            margin-bottom: 1.2rem;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        .footer-links {
            list-style: none;
            padding: 0;
        }

        .footer-links li {
            margin-bottom: 0.5rem;
        }

        .footer-links a {
            color: #6c757d;
            text-decoration: none;
            transition: color 0.2s;
        }

        .footer-links a:hover {
            color: #0d6efd; /* Bootstrap Blue */
        }
    </style>

</head>
<body>
    <div id="content">
        {% block content %}

        {% endblock %}
    </div>
    

    <script>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                {% if category == "error" %}
                PNotify.error({
                    text: "{{ message }}",
                    type: "error",
                    delay: 2000,
                });
                {% elif category == "success" %}
                PNotify.success({
                    text: "{{ message }}",
                    type: "success",
                    delay: 2000,
                });
                {% elif category == "message" %}
                PNotify.info({
                    text: "{{ message }}",
                    type: "info",
                    delay: 2000,
                });
                {% endif %}
            {% endfor %}
        {% endif %}
    {% endwith %}
    </script>
</body>
</html>
